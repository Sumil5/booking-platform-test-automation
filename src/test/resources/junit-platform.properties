# Reports: HTML for people, JSON for CI tooling, pretty console output for logs.
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json, timeline:target/cucumber-reports/timeline
cucumber.publish.quiet=true
cucumber.snippet-type=camelcase

# Tag selection is done with Surefire's -Dgroups (JUnit Platform tags, see pom.xml) rather
# than cucumber.filter.tags, which reports every filtered-out scenario as "skipped".

# Scenarios are independent and the token provider is thread-safe, so parallel runs are
# possible. They stay off by default to be gentle on the shared public environment.
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4
